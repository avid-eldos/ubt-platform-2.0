<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBT Platform</title>
    
    <!-- Подключаем Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <div class="page-wrapper">
            
            <!-- Карточка приветствия и статуса подписки -->
            <div class="card">
                <h2 id="welcome-title">Загрузка...</h2>
                <p id="status-text">Проверяем статус подписки...</p>
                
                <div id="action-container">
                    <!-- Сюда динамически добавится кнопка перехода к курсам или кнопки связи -->
                </div>
            </div>

            <!-- Статистика и лента активности (для мотивации) -->
            <div class="news-section">
                <div class="news-title">📊 Твоя статистика</div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-num" id="tests-passed">0</span>
                        <span class="stat-label">Пройдено тестов</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-num" id="avg-score">0%</span>
                        <span class="stat-label">Средний балл</span>
                    </div>
                </div>

                <div class="news-title" style="margin-top: 20px;">📰 Важные новости</div>
                <div id="news-container">
                    <div class="news-card promo-card">
                        <div class="news-tag">АКЦИЯ / ЕНТ-2026</div>
                        <div class="news-content">Готовься по всем предметам без ограничений. При покупке полного доступа — обновление материалов бесплатно!</div>
                    </div>
                </div>
            </div>

            <!-- Отладка (если что-то пойдет не так) -->
            <div id="debug-info" class="debug-box hidden"></div>

        </div>
    </div>

    <!-- Подключаем наши скрипты -->
    <script src="js/config.local.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Фейковый юзер для браузера (если ты не в ТГ)
        const user = tg.initDataUnsafe?.user || {
            id: 123456789,
            first_name: "Тестовый",
            last_name: "Юзер",
            username: "test_user"
        };

        document.addEventListener("DOMContentLoaded", async () => {
            console.log("Страница загружена, проверяем юзера:", user.id);
            document.getElementById("welcome-title").innerText = `Привет, ${user.first_name}! 👋`;
            const statusText = document.getElementById("status-text");

            try {
                // 1. Проверяем юзера
                let { data: existingUser, error: fetchError } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('telegram_id', user.id)
                    .single();

                if (fetchError && fetchError.code !== 'PGRST116') {
                    console.error("Ошибка базы данных:", fetchError);
                    statusText.innerText = "Ошибка: " + fetchError.message;
                    return;
                }

                if (!existingUser) {
                    console.log("Юзер не найден, создаем...");
                    await supabaseClient.from('users').insert([{
                        telegram_id: user.id,
                        first_name: user.first_name,
                        last_name: user.last_name || '',
                        username: user.username || ''
                    }]);
                }

                // 2. Проверяем доступы
                console.log("Проверяем доступы для ID:", user.id);
                let { data: accesses, error: accessError } = await supabaseClient
                    .from('user_subject_access')
                    .select('subject_id')
                    .eq('user_id', user.id);

                if (accessError) throw accessError;

                const actionContainer = document.getElementById("action-container");
                actionContainer.innerHTML = ""; // Чистим перед заполнением

                if (accesses && accesses.length > 0) {
                    statusText.innerText = `У тебя открыт доступ к ${accesses.length} предмет(ам).`;
                    const btn = document.createElement("a");
                    btn.href = "courses.html";
                    btn.className = "btn";
                    btn.innerText = "🎓 Перейти к курсам";
                    actionContainer.appendChild(btn);
                } else {
                    console.log("Доступов нет.");
                    statusText.innerText = "У тебя пока нет активных доступов.";
                    // Добавляем кнопки связи
                    const waBtn = document.createElement("a");
                    waBtn.href = `https://wa.me/${CONFIG.CONTACT_WHATSAPP}`;
                    waBtn.className = "btn btn-wa";
                    waBtn.innerText = "💬 Написать в WhatsApp";
                    actionContainer.appendChild(waBtn);
                }

            } catch (err) {
                console.error("Критическая ошибка:", err);
                statusText.innerText = "Ошибка загрузки: " + err.message;
            }
        });
    </script>
</body>
</html>
