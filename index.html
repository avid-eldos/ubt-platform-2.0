<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBT Platform</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Стили для контейнера статистики */
        .stats-banner {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            margin: 15px 0;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            color: #e0e0e0;
        }
        .stats-banner strong {
            color: #4caf50;
            font-size: 16px;
        }
        .stats-banner .highlight-today {
            color: #ff9800;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="page-wrapper">
            
            <div class="card">
                <h2 id="welcome-title">Загрузка...</h2>
                <p id="status-text">Проверяем данные...</p>

                <!-- Контейнер статистики учеников -->
                <div id="stats-container" class="stats-banner" style="display: none;">
                    🎓 С нами уже <strong id="total-students-count">0</strong> учеников &bull; 
                    <span class="highlight-today">+<span id="today-students-count">0</span> сегодня</span>
                </div>
                
                <div id="action-container" style="margin-top: 20px;">
                    <!-- Сюда динамически встанет нужная кнопка или кнопки связи -->
                </div>
            </div>

            <!-- Отладка -->
            <div id="debug-info" class="debug-box hidden" style="margin-top: 15px;"></div>

        </div>
    </div>

    <!-- Конфиг -->
    <script src="js/config.js"></script>    
    <script>
        const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
        const tg = window.Telegram.WebApp;
        tg.expand();

        const telegramUser = tg.initDataUnsafe?.user;
        const user = (telegramUser && telegramUser.id) ? telegramUser : {
            id: 123456789,
            first_name: "Тестовый",
            last_name: "Юзер",
            username: "test_user"
        };

        // Функция подсчета статистики учеников
        async function loadStudentStats() {
            const BASE_TOTAL = 145; // Опорное число (от 100 до 200)
            const START_DATE = new Date('2026-08-01'); // Точка отсчета проекта

            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

            // 1. Запрашиваем все доступы из таблицы
            const { data: accesses, error } = await supabaseClient
                .from('user_subject_access')
                .select('user_id, granted_at');

            if (error) {
                console.error("Ошибка при получении статистики:", error);
                return;
            }

            // 2. Находим дату самого первого доступа для каждого уникального user_id
            const userFirstAccess = {};
            (accesses || []).forEach(item => {
                const time = new Date(item.granted_at).getTime();
                if (!userFirstAccess[item.user_id] || time < userFirstAccess[item.user_id]) {
                    userFirstAccess[item.user_id] = time;
                }
            });

            const realTotalUsers = Object.keys(userFirstAccess).length;
            let realTodayUsers = 0;

            Object.values(userFirstAccess).forEach(firstAccessTime => {
                if (firstAccessTime >= todayStart) {
                    realTodayUsers++;
                }
            });

            // 3. Детерминированный расчет искусственной прибавки (3-5 человек в день)
            function getDailyFake(dateObj) {
                const daySeed = dateObj.getFullYear() * 10000 + (dateObj.getMonth() + 1) * 100 + dateObj.getDate();
                return 3 + (daySeed % 3); // Возвращает 3, 4 или 5
            }

            // Накрутка за прошлые дни
            let fakePastSum = 0;
            let curr = new Date(START_DATE);
            const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            while (curr < todayMidnight) {
                fakePastSum += getDailyFake(curr);
                curr.setDate(curr.getDate() + 1);
            }

            const fakeToday = getDailyFake(now);

            // Итоговые числа
            const displayToday = realTodayUsers + fakeToday;
            const displayTotal = BASE_TOTAL + realTotalUsers + fakePastSum + fakeToday;

            // Вывод в DOM
            document.getElementById("total-students-count").innerText = displayTotal;
            document.getElementById("today-students-count").innerText = displayToday;
            document.getElementById("stats-container").style.display = "block";
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const welcomeTitle = document.getElementById("welcome-title");
            const statusText = document.getElementById("status-text");
            const actionContainer = document.getElementById("action-container");

            try {
                // 1. Автоматическая запись / проверка юзера в базе данных
                let { data: existingUser, error: fetchError } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('telegram_id', user.id)
                    .single();

                if (!existingUser) {
                    let { error: insertError } = await supabaseClient.from('users').insert([{
                        telegram_id: user.id,
                        first_name: user.first_name || '',
                        last_name: user.last_name || '',
                        username: user.username || ''
                    }]);

                    if (insertError) throw insertError;
                }

                welcomeTitle.innerText = `Привет, ${user.first_name}! 👋`;

                // 2. Подгружаем счетчик учеников
                await loadStudentStats();

                // 3. Проверяем доступы пользователя к предметам
                let { data: accesses, error: accessError } = await supabaseClient
                    .from('user_subject_access')
                    .select('subject_id')
                    .eq('user_id', user.id);

                if (accessError) throw accessError;

                actionContainer.innerHTML = "";

                if (accesses && accesses.length > 0) {
                    statusText.innerText = `У тебя открыт доступ к предметам. Отличной подготовки! 🚀`;

                    const btnCourses = document.createElement("a");
                    btnCourses.href = "courses.html";
                    btnCourses.className = "btn";
                    btnCourses.innerText = "🎓 Перейти к курсам";
                    actionContainer.appendChild(btnCourses);

                } else {
                    statusText.innerText = "У тебя пока нет доступа к курсам. Приобрести доступ можно, написав нам в Telegram или WhatsApp:";

                    const waBtn = document.createElement("a");
                    waBtn.href = `https://wa.me/${CONFIG.CONTACT_WHATSAPP}?text=Здравствуйте! Хочу приобрести доступ к платформе ЕНТ. Мой Telegram ID: ${user.id}`;
                    waBtn.className = "btn btn-wa";
                    waBtn.innerText = "💬 Написать в WhatsApp";
                    actionContainer.appendChild(waBtn);

                    const tgBtn = document.createElement("a");
                    tgBtn.href = `https://t.me/${CONFIG.CONTACT_TELEGRAM}`;
                    tgBtn.className = "btn btn-tg";
                    tgBtn.innerText = "✈️ Написать в Telegram";
                    tgBtn.style.marginTop = "10px";
                    actionContainer.appendChild(tgBtn);
                }

            } catch (err) {
                console.error("Ошибка:", err);
                welcomeTitle.innerText = "Ошибка";
                statusText.innerText = "Не удалось загрузить данные.";
                const debugBox = document.getElementById("debug-info");
                debugBox.classList.remove("hidden");
                debugBox.innerText = err.message;
            }
        });
    </script>
</body>
</html>
