<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестирование - UBT Platform</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="css/style.css">
    <style>
        .question-card {
            background: var(--tg-theme-bg-color, #fff);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            text-align: left;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .q-meta { font-size: 12px; color: var(--tg-theme-hint-color); margin-bottom: 4px; }
        .q-text { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
        .q-hint { font-size: 12px; color: var(--tg-theme-hint-color); margin: 2px 0 8px; }

        .context-box {
            background: rgba(36,129,204,0.06);
            border-left: 4px solid var(--tg-theme-button-color, #2481cc);
            padding: 10px 14px; border-radius: 6px; margin-bottom: 12px;
            font-size: 14px; line-height: 1.5;
        }

        .option-btn {
            display: block; width: 100%; padding: 10px 14px; margin-top: 8px;
            background: rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.08);
            border-radius: 8px; text-align: left; cursor: pointer;
            font-size: 14px; color: var(--tg-theme-text-color, #000); transition: all 0.2s;
        }
        .option-btn:hover { background: rgba(36,129,204,0.08); border-color: var(--tg-theme-button-color, #2481cc); }
        .option-btn.selected {
            background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff);
            border-color: var(--tg-theme-button-color, #2481cc);
        }
        .option-btn.correct { background:#28a745 !important; color:#fff !important; border-color:#28a745 !important; }
        .option-btn.wrong   { background:#dc3545 !important; color:#fff !important; border-color:#dc3545 !important; }
        .option-btn:disabled { cursor: default; }

        /* --- MATCHING --- */
        .match-wrap { display:flex; gap:10px; margin-top:8px; }
        .match-col { flex:1; display:flex; flex-direction:column; gap:8px; }
        .match-cell {
            padding:10px 12px; border-radius:8px; font-size:14px; cursor:pointer;
            background: rgba(0,0,0,0.03); border:2px solid rgba(0,0,0,0.10);
            text-align:center; transition: all 0.15s; color: var(--tg-theme-text-color,#000);
            word-break: break-word;
        }
        .match-cell.active { border-color: var(--tg-theme-button-color,#2481cc); border-style:dashed; }
        .match-cell.paired { color:#fff; border-style:solid; }
        .match-legend { font-size:12px; color:var(--tg-theme-hint-color); margin-top:6px; }

        .result-banner {
            background: #4a5568; color:#fff; border-radius:12px; padding:16px;
            text-align:center; margin-bottom:15px;
        }
        .result-banner .score { font-size:24px; font-weight:700; }
    </style>
</head>
<body>

    <div class="container">
        <div class="page-wrapper">

            <div class="card" style="text-align:center;">
                <h2 id="test-title">Загрузка теста...</h2>
                <p id="test-subtitle" style="color:var(--tg-theme-hint-color,#888); font-size:13px; margin-top:4px;">
                    Готовим вопросы...
                </p>
            </div>

            <div id="result-slot"></div>
            <div id="questions-container">
                <p id="loading-questions-text" style="text-align:center; color:var(--tg-theme-hint-color);">Загружаем...</p>
            </div>

            <button id="submit-btn" class="btn" style="display:none; margin-bottom:10px;">Завершить тест</button>
            <a id="back-btn" href="javascript:history.back()" class="btn"
               style="background-color:var(--tg-theme-hint-color,#888); text-decoration:none; text-align:center;">⬅️ Назад</a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script>
    const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    const tg = window.Telegram.WebApp;
    tg.expand();

    const urlParams  = new URLSearchParams(window.location.search);
    const lessonId   = urlParams.get('lesson_id');
    const subjectId  = urlParams.get('subject_id');
    const mode       = lessonId ? 'lecture' : 'full';

    const PAIR_COLORS = ['#2481cc', '#28a745', '#e67e22', '#8e44ad'];

    let ATTEMPT_ID = null;
    let QUESTIONS  = [];
    let ANSWERS    = {};
    let MATCH_STATE = {};

    function getUserId() {
        try {
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user)
                return String(tg.initDataUnsafe.user.id);
        } catch(e){}
        return null;
    }

    function updatePageTexts() {
        const isKz = currentLang === 'kz';
        const titleEl = document.getElementById("test-title");
        const subEl = document.getElementById("test-subtitle");
        const loadingText = document.getElementById("loading-questions-text");
        const submitBtn = document.getElementById("submit-btn");
        const backBtn = document.getElementById("back-btn");

        if (titleEl && !ATTEMPT_ID) {
            titleEl.innerText = isKz ? "Тест жүктелуде..." : "Загрузка теста...";
        }
        if (subEl && !ATTEMPT_ID) {
            subEl.innerText = isKz ? "Сұрақтар дайындалуда..." : "Готовим вопросы...";
        }
        if (loadingText) {
            loadingText.innerText = isKz ? "Жүктелуде..." : "Загружаем...";
        }
        if (submitBtn && submitBtn.style.display !== "none" && !submitBtn.disabled) {
            submitBtn.innerText = isKz ? "Тестті аяқтау" : "Завершить тест";
        }
        if (backBtn) {
            backBtn.innerText = isKz ? "⬅️ Артқа" : "⬅️ Назад";
        }
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const container = document.getElementById("questions-container");
        const titleEl   = document.getElementById("test-title");
        const subEl     = document.getElementById("test-subtitle");
        const submitBtn = document.getElementById("submit-btn");

        updatePageTexts();

        const sid = subjectId ? parseInt(subjectId) : null;
        const lid = lessonId ? parseInt(lessonId) : null;
        const isKz = currentLang === 'kz';

        if (!sid && !lid) {
            titleEl.innerText = isKz ? "Қате" : "Ошибка";
            container.innerHTML = `<div class='card'><p style='text-align:center;'>${isKz ? "Тест көзі көрсетілмеген." : "Не указан источник теста."}</p></div>`;
            return;
        }

        titleEl.innerText = mode === 'lecture' 
            ? (isKz ? "Тақырып бойынша тест" : "Тест по теме") 
            : (isKz ? "Пән бойынша жалпы тест" : "Общий тест по предмету");
        subEl.innerText   = isKz ? "Жауаптарды таңдап, тестті аяқтаңыз" : "Выберите ответы и завершите тест";

        try {
            const { data, error } = await supabaseClient.rpc('generate_test', {
                p_subject_id: sid,
                p_mode:       mode,
                p_lesson_id:  lid,
                p_user_id:    getUserId()
            });
            if (error) throw error;

            ATTEMPT_ID = data.attempt_id;
            QUESTIONS  = data.questions || [];

            if (QUESTIONS.length === 0) {
                container.innerHTML = `<div class='card'><p style='text-align:center; color:var(--tg-theme-hint-color);'>${isKz ? "Бұл бөлімде әзірге сұрақтар жоқ." : "Для этого раздела пока нет вопросов."}</p></div>`;
                return;
            }

            renderQuestions(container);
            submitBtn.style.display = "block";
            submitBtn.innerText = isKz ? "Тестті аяқтау" : "Завершить тест";
            submitBtn.onclick = submitTest;

        } catch (err) {
            console.error("Ошибка генерации теста:", err);
            container.innerHTML = `<div class='card'><p style='color:red; text-align:center;'>${isKz ? "Тестті жүктеу мүмкін болмады." : "Не удалось загрузить тест."}</p></div>`;
        }
    });

    function renderQuestions(container) {
        container.innerHTML = "";
        let lastContext = null;
        const isKz = currentLang === 'kz';

        QUESTIONS.forEach((q) => {
            const card = document.createElement("div");
            card.className = "question-card";

            let contextHtml = "";
            if (q.question_type === 'context' && q.context_body && q.context_body !== lastContext) {
                contextHtml = `<div class="context-box">${escapeHtml(q.context_body)}</div>`;
                lastContext = q.context_body;
            }

            let imageHtml = "";
            if (q.image_url) {
                imageHtml = `<div style="margin:10px 0; text-align:center;">
                    <img src="${q.image_url}" alt="" style="max-width:100%; max-height:250px; border-radius:8px; object-fit:contain;"></div>`;
            }

            let bodyHtml = "";
            if (q.question_type === 'matching') {
                bodyHtml = renderMatching(q);
            } else {
                bodyHtml = renderChoice(q);
            }

            let hint = "";
            if (q.question_type === 'multiple') hint = isKz ? "Бірнеше нұсқаны таңдауға болады" : "Можно выбрать несколько вариантов";
            if (q.question_type === 'matching') hint = isKz ? "Жұптарды байланыстырыңыз: сол жақты, содан кейін оң жақты басыңыз." : "Свяжите пары: тапните слева, затем справа. Тап по паре — разорвать.";

            card.innerHTML = `
                <div class="q-meta">${isKz ? `${q.position}-сұрақ (${QUESTIONS.length} ішінен)` : `Вопрос ${q.position} из ${QUESTIONS.length}`}</div>
                ${contextHtml}
                <div class="q-text">${escapeHtml(q.question_text)}</div>
                ${hint ? `<div class="q-hint">${hint}</div>` : ""}
                ${imageHtml}
                <div id="body-${q.position}">${bodyHtml}</div>
            `;
            container.appendChild(card);
        });
    }

    function renderChoice(q) {
        const opts = q.options || [];
        let html = "";
        opts.forEach((opt) => {
            const safe = escapeHtml(opt);
            html += `<button class="option-btn" data-text="${encodeURIComponent(opt)}"
                        onclick="onChoice(${q.position}, '${q.question_type}', this)">${safe}</button>`;
        });
        return html;
    }

    function renderMatching(q) {
        const left  = (q.matching && q.matching.left)  || [];
        const right = (q.matching && q.matching.right) || [];
        MATCH_STATE[q.position] = { pairs: [], activeLeft: null, activeRight: null };

        let leftHtml = left.map(v =>
            `<div class="match-cell" data-side="left" data-text="${encodeURIComponent(v)}"
                  onclick="onMatchTap(${q.position},'left',this)">${escapeHtml(v)}</div>`).join("");
        let rightHtml = right.map(v =>
            `<div class="match-cell" data-side="right" data-text="${encodeURIComponent(v)}"
                  onclick="onMatchTap(${q.position},'right',this)">${escapeHtml(v)}</div>`).join("");

        return `<div class="match-wrap">
                    <div class="match-col">${leftHtml}</div>
                    <div class="match-col">${rightHtml}</div>
                </div>`;
    }

    window.onChoice = function(position, type, btn) {
        const parent = btn.parentElement;
        const text = decodeURIComponent(btn.dataset.text);

        if (type === 'multiple') {
            btn.classList.toggle('selected');
            const chosen = Array.from(parent.querySelectorAll('.option-btn.selected'))
                                    .map(b => decodeURIComponent(b.dataset.text));
            ANSWERS[position] = { answer: chosen };
        } else {
            parent.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            ANSWERS[position] = { answer: [text] };
        }
    };

    window.onMatchTap = function(position, side, cell) {
        const st = MATCH_STATE[position];
        const text = decodeURIComponent(cell.dataset.text);

        if (cell.classList.contains('paired')) {
            breakPair(position, side, text);
            syncMatchAnswer(position);
            return;
        }

        if (side === 'left')  { st.activeLeft  = { text, el: cell }; markActive(position); }
        if (side === 'right') { st.activeRight = { text, el: cell }; markActive(position); }

        if (st.activeLeft && st.activeRight) {
            const colorIdx = st.pairs.length % PAIR_COLORS.length;
            const color = PAIR_COLORS[colorIdx];
            st.pairs.push([st.activeLeft.text, st.activeRight.text]);

            st.activeLeft.el.classList.remove('active');
            st.activeRight.el.classList.remove('active');
            st.activeLeft.el.classList.add('paired');
            st.activeRight.el.classList.add('paired');
            st.activeLeft.el.style.background = color;
            st.activeRight.el.style.background = color;
            st.activeLeft.el.style.borderColor = color;
            st.activeRight.el.style.borderColor = color;

            st.activeLeft = null; st.activeRight = null;
            syncMatchAnswer(position);
        }
    };

    function markActive(position) {
        const st = MATCH_STATE[position];
        if (st.activeLeft)  st.activeLeft.el.classList.add('active');
        if (st.activeRight) st.activeRight.el.classList.add('active');
    }

    function breakPair(position, side, text) {
        const st = MATCH_STATE[position];
        const idx = st.pairs.findIndex(p => (side === 'left' ? p[0] : p[1]) === text);
        if (idx === -1) return;
        const [lTxt, rTxt] = st.pairs[idx];
        st.pairs.splice(idx, 1);

        const body = document.getElementById(`body-${position}`);
        body.querySelectorAll('.match-cell').forEach(c => {
            const t = decodeURIComponent(c.dataset.text);
            if ((c.dataset.side === 'left' && t === lTxt) ||
                (c.dataset.side === 'right' && t === rTxt)) {
                c.classList.remove('paired','active');
                c.style.background = ''; c.style.borderColor = '';
            }
        });
    }

    function syncMatchAnswer(position) {
        ANSWERS[position] = { pairs: MATCH_STATE[position].pairs.slice() };
    }

    async function submitTest() {
        const submitBtn = document.getElementById("submit-btn");
        const isKz = currentLang === 'kz';
        submitBtn.disabled = true;
        submitBtn.innerText = isKz ? "Тексеруде..." : "Проверяем...";

        const payload = QUESTIONS.map(q => {
            const a = ANSWERS[q.position] || {};
            if (q.question_type === 'matching') {
                return { position: q.position, pairs: a.pairs || [] };
            }
            return { position: q.position, answer: a.answer || [] };
        });

        try {
            const { data, error } = await supabaseClient.rpc('submit_test', {
                p_attempt_id: ATTEMPT_ID,
                p_answers: payload
            });
            if (error) throw error;
            showResults(data);
        } catch (err) {
            console.error("Ошибка отправки:", err);
            submitBtn.disabled = false;
            submitBtn.innerText = isKz ? "Қате. Қайталау" : "Ошибка. Повторить";
        }
    }

    function showResults(res) {
        const submitBtn = document.getElementById("submit-btn");
        submitBtn.style.display = "none";
        const isKz = currentLang === 'kz';

        const banner = document.getElementById("result-slot");
        banner.innerHTML = `
            <div class="result-banner">
                <div class="score">${res.score} / ${res.max_score}</div>
                <div>${res.percent}% ${isKz ? "дұрыс" : "верно"}</div>
            </div>`;

        (res.details || []).forEach(d => {
            const body = document.getElementById(`body-${d.position}`);
            if (!body) return;

            if (d.question_type === 'matching') {
                const correctList = (d.correct || []).map(p => `${escapeHtml(p[0])} → ${escapeHtml(p[1])}`).join("<br>");
                const note = document.createElement("div");
                note.className = "match-legend";
                note.innerHTML = `<b>${isKz ? "Дұрыс жұптар:" : "Правильные пары:"}</b><br>${correctList}`;
                body.appendChild(note);
                body.querySelectorAll('.match-cell').forEach(c => c.onclick = null);
            } else {
                const correctTexts = (d.correct || []).map(String);
                body.querySelectorAll('.option-btn').forEach(btn => {
                    btn.disabled = true; btn.onclick = null;
                    const t = decodeURIComponent(btn.dataset.text);
                    const chosen = btn.classList.contains('selected');
                    if (correctTexts.includes(t)) btn.classList.add('correct');
                    else if (chosen) btn.classList.add('wrong');
                });
            }
        });

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function escapeHtml(s) {
        if (s == null) return "";
        return String(s).replace(/[&<>"']/g, m =>
            ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    </script>
</body>
</html>
