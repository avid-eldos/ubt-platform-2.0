<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предмет - UBT Platform</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <div class="page-wrapper">
            
            <div class="card" style="text-align: center;">
                <h2 id="subject-title">Загрузка предмета...</h2>
            </div>

            <!-- Две главные кнопки: Лекции и Тест -->
            <div id="actions-container" style="display: flex; flex-direction: column; gap: 12px; margin-top: 20px;">
                <a id="btn-lessons" href="#" class="btn" style="text-align: center; text-decoration: none;">📖 Лекции и теория</a>
                <a id="btn-test" href="#" class="btn" style="text-align: center; text-decoration: none; background-color: #28a745;">📝 Общий тест по предмету</a>
            </div>

            <a id="btn-back" href="courses.html" class="btn" style="background-color: var(--tg-theme-hint-color, #888); margin-top: 20px; text-align: center; text-decoration: none;">⬅️ К списку предметов</a>

        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Получаем ID предмета из URL
        const urlParams = new URLSearchParams(window.location.search);
        const subjectId = urlParams.get('subject_id');

        // Функция обновления текстов на странице при смене языка
        function updatePageTexts() {
            const isKz = currentLang === 'kz';

            const titleEl = document.getElementById("subject-title");
            const btnLessons = document.getElementById("btn-lessons");
            const btnTest = document.getElementById("btn-test");
            const btnBack = document.getElementById("btn-back");

            // Если страница еще в процессе загрузки, обновляем текст заголовка
            if (titleEl && titleEl.innerText.includes("Загрузка") || titleEl.innerText.includes("Жүктелуде")) {
                titleEl.innerText = isKz ? "Пән жүктелуде..." : "Загрузка предмета...";
            }

            if (btnLessons) btnLessons.innerText = isKz ? "📖 Дәрістер мен теория" : "📖 Лекции и теория";
            if (btnTest) btnTest.innerText = isKz ? "📝 Пән бойынша жалпы тест" : "📝 Общий тест по предмету";
            if (btnBack) btnBack.innerText = isKz ? "⬅️ Пәндер тізіміне" : "⬅️ К списку предметов";
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const titleEl = document.getElementById("subject-title");
            const btnLessons = document.getElementById("btn-lessons");
            const btnTest = document.getElementById("btn-test");

            updatePageTexts();

            if (!subjectId) {
                titleEl.innerText = currentLang === 'kz' ? "Қате: Пән таңдалмаған." : "Ошибка: Предмет не выбран.";
                return;
            }

            try {
                // Получаем информацию о предмете из базы
                let { data: subject, error } = await supabaseClient
                    .from('subjects')
                    .select('*')
                    .eq('id', subjectId)
                    .single();

                if (error) throw error;

                if (subject) {
                    titleEl.innerText = subject.title;
                    
                    // Настраиваем ссылки для кнопок
                    btnLessons.href = `lessons.html?subject_id=${subject.id}`;
                    btnTest.href = `test.html?subject_id=${subject.id}`;
                } else {
                    titleEl.innerText = currentLang === 'kz' ? "Пән табылмады" : "Предмет не найден";
                }

            } catch (err) {
                console.error("Ошибка загрузки предмета:", err);
                titleEl.innerText = currentLang === 'kz' ? "Қате: деректерді жүктеу мүмкін болмады." : "Ошибка: не удалось загрузить данные.";
            }
        });
    </script>
</body>
</html>
